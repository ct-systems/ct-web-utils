<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#111827; color:#f9fafb; }
    main { width:min(560px,calc(100% - 32px)); box-sizing:border-box; padding:28px; border:1px solid #374151; border-radius:16px; background:#1f2937; }
    h1 { margin:0 0 8px; font-size:24px; }
    p { line-height:1.5; color:#d1d5db; }
    .muted { color:#9ca3af; font-size:14px; }
    .error { color:#fca5a5; white-space:pre-wrap; }
    .hidden { display:none; }
    label { display:block; margin:14px 0 6px; color:#e5e7eb; }
    input { width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid #4b5563; border-radius:8px; background:#111827; color:#fff; }
    .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    button { padding:10px 14px; border:0; border-radius:8px; cursor:pointer; font-weight:600; }
    .primary { background:#f9fafb; color:#111827; }
    .secondary { background:#374151; color:#f9fafb; }
    .client-box { margin-top:16px; padding:14px; border-radius:10px; background:#111827; border:1px solid #374151; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <p class="muted">Enter your account credentials to continue.</p>

    <section id="login" class="hidden">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div class="row"><button id="loginButton" class="primary" type="button">Sign in</button></div>
    </section>

    <section id="consent" class="hidden">
      <div class="client-box">
        <p id="clientName"></p>
        <p id="scopeText" class="muted"></p>
      </div>
      <p class="muted">Review the requested access and continue only if you initiated this connection.</p>
      <div class="row">
        <button id="approveButton" class="primary" type="button">Approve</button>
        <button id="denyButton" class="secondary" type="button">Deny</button>
        <button id="signOutButton" class="secondary" type="button">Sign out</button>
      </div>
    </section>

    <p id="status" class="muted">Loading…</p>
    <p id="error" class="error"></p>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://ntmlsfxgzmynrwdpbxgi.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yXtBY3RYNkAinVscZXnAlw_aUFFPA6E";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const params = new URLSearchParams(window.location.search);
    const authorizationId = params.get("authorization_id");

    const login = document.getElementById("login");
    const consent = document.getElementById("consent");
    const status = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const clientName = document.getElementById("clientName");
    const scopeText = document.getElementById("scopeText");

    function showError(message) { errorEl.textContent = message || ""; }

    async function render() {
      showError("");
      const { data: sessionData } = await supabase.auth.getSession();

      if (!sessionData.session) {
        login.classList.remove("hidden");
        consent.classList.add("hidden");
        status.textContent = "";
        return;
      }

      if (!authorizationId) {
        login.classList.add("hidden");
        consent.classList.add("hidden");
        status.textContent = "This sign-in request is no longer valid.";
        return;
      }

      login.classList.add("hidden");

      const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);

      if (error || !data) {
        status.textContent = "";
        showError(error?.message || "Unable to load authorization request.");
        return;
      }

      if (!("authorization_id" in data)) {
        window.location.assign(data.redirect_url);
        return;
      }

      clientName.textContent = "Application: " + (data.client?.name || "Connected application");
      const scopes = typeof data.scope === "string" && data.scope.trim() ? data.scope : "read access";
      scopeText.textContent = "Requested permissions: " + scopes;

      consent.classList.remove("hidden");
      status.textContent = "Signed in and ready for approval.";
    }

    document.getElementById("loginButton").addEventListener("click", async () => {
      showError("");
      status.textContent = "Signing in…";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        status.textContent = "";
        showError(error.message);
        return;
      }

      await render();
    });

    document.getElementById("approveButton").addEventListener("click", async () => {
      showError("");
      status.textContent = "Approving…";
      const { data, error } = await supabase.auth.oauth.approveAuthorization(authorizationId);

      if (error || !data) {
        status.textContent = "";
        showError(error?.message || "Approval failed.");
        return;
      }

      window.location.assign(data.redirect_url);
    });

    document.getElementById("denyButton").addEventListener("click", async () => {
      showError("");
      status.textContent = "Denying…";
      const { data, error } = await supabase.auth.oauth.denyAuthorization(authorizationId);

      if (error || !data) {
        status.textContent = "";
        showError(error?.message || "Denial failed.");
        return;
      }

      window.location.assign(data.redirect_url);
    });

    document.getElementById("signOutButton").addEventListener("click", async () => {
      await supabase.auth.signOut();
      await render();
    });

    await render();
  </script>
</body>
</html>
